# =============================================================================
# GitHub Actions — Build, Segurança e Deploy (Next.js)
# =============================================================================
#
# Este workflow executa em 3 etapas sequenciais (jobs):
#
#   [1] lint-and-test  →  [2] build-and-push  →  [3] deploy
#
# Etapa 1 — Linter e Testes:
#   Instala as dependências, roda o linter de código (ESLint).
#
# Etapa 2 — Build e Push da imagem Docker:
#   Constrói a imagem de produção (multi-stage), escaneia com Trivy e faz push
#   para o GitHub Container Registry (GHCR). A imagem só é publicada se o
#   scan não encontrar vulnerabilidades HIGH/CRITICAL com correção disponível.
#
# Etapa 3 — Deploy no servidor:
#   Via SSH, baixa a nova imagem e reinicia apenas o container da aplicação
#   (o banco de dados permanece em execução).
#
# =============================================================================

name: Build & Deploy Next.js

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:

  # ============================================================================
  # JOB 1 — Validação de código Fonte
  # ============================================================================
  lint-and-test:
    name: Lint e Validação
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Rodar Linter
        run: npm run lint

  # ============================================================================
  # JOB 2 — Build da imagem Docker de produção, scan Trivy e push para GHCR
  # ============================================================================
  build-and-push:
    name: Build e push da imagem
    runs-on: ubuntu-latest
    needs: lint-and-test

    permissions:
      contents: read
      packages: write

    outputs:
      image-tags: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extrair metadados (tags e labels OCI)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Configurar Docker Buildx (BuildKit)
        uses: docker/setup-buildx-action@v3

      - name: Build da imagem (sem push — para scan Trivy)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          load: true
          tags: app:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy — scan de vulnerabilidades na imagem Docker
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: app:scan
          format: table
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true

      - name: Build e push para o GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # JOB 3 — Deploy no servidor via SSH
  # ============================================================================
  deploy:
    name: Deploy em produção
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Copiar docker-compose.prod.yml para o servidor
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_DEPLOY_KEY }}
          source: docker/docker-compose.prod.yml
          target: /home/${{ secrets.SERVER_USER }}/mercado/

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          IMAGE_FULL: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          DB_USER: ${{ secrets.DATABASE_USERNAME }}
          DB_PASS: ${{ secrets.DATABASE_PASSWORD }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_DEPLOY_KEY }}
          envs: GHCR_TOKEN,GHCR_USER,IMAGE_FULL,DB_USER,DB_PASS
          script_stop: true
          script: |
            set -euo pipefail

            DEPLOY_DIR="/home/${{ secrets.SERVER_USER }}/mercado"
            COMPOSE_FILE="$DEPLOY_DIR/docker/docker-compose.prod.yml"

            echo "======================================================"
            echo " Deploy iniciado: $(date)"
            echo " Imagem: $IMAGE_FULL"
            echo "======================================================"

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            echo "✓ Autenticado no GHCR"

            docker pull "$IMAGE_FULL"
            echo "✓ Imagem baixada: $IMAGE_FULL"

            mkdir -p "$DEPLOY_DIR"
            cd "$DEPLOY_DIR"

            # Cria ou recria o arquivo .env com as credenciais do Github Secrets
            echo "DATABASE_USERNAME=$DB_USER" > .env
            echo "DATABASE_PASSWORD=$DB_PASS" >> .env
            echo "APP_IMAGE=$IMAGE_FULL" >> .env
            echo "✓ .env configurado automaticamente"

            echo "Reiniciando container da aplicação..."
            docker compose -f "$COMPOSE_FILE" up -d \
              --no-deps \
              --force-recreate \
              app
            echo "✓ Container reiniciado"

            docker image prune -f > /dev/null
            echo "✓ Imagens antigas removidas"

            echo "======================================================"
            echo " Deploy concluído com sucesso: $(date)"
            echo "======================================================"
