version: '3.8'

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: eq16
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME} -d eq16"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    build: .
    ports:
      - "127.0.0.1:8116:8080"
    environment:
      # Sem parâmetros de pool na URL: o adapter pg IGNORA `maximum_pool_size`
      # (era sintaxe do Prisma clássico). O pool é configurado pela env abaixo.
      DATABASE_URL: postgresql://${DATABASE_USERNAME}:${DATABASE_PASSWORD}@db:5432/eq16
      DATABASE_POOL_MAX: "5"
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      # Integração com Discord (login/vínculo OAuth + bot de canais por equipe).
      # Defina os valores no .env do servidor; veja .env.example para detalhes.
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET}
      # Valida a assinatura Ed25519 dos botões (Interactions Endpoint). Sem ela,
      # POST /api/discord/interactions responde 401 e os botões Aceitar/Recusar não funcionam.
      DISCORD_PUBLIC_KEY: ${DISCORD_PUBLIC_KEY}
      DISCORD_TOKEN_ENC_KEY: ${DISCORD_TOKEN_ENC_KEY}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID}
      DISCORD_TEAMS_CATEGORY_ID: ${DISCORD_TEAMS_CATEGORY_ID}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
